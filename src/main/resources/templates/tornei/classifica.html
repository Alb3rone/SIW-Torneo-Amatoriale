<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Classifica')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="page-title">Classifica</h1>
    <p class="page-subtitle">
        Torneo: <strong th:text="${torneo.nome}"></strong> &middot;
        <a th:href="@{/tornei/{id}(id=${torneo.id})}">torna al dettaglio</a>
    </p>

    <!-- Container per il modulo React -->
    <div id="classifica-react"
         th:attr="data-torneo-id=${torneo.id}"
         class="card">
        <p style="color: var(--color-text-soft);">Caricamento classifica...</p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- React via CDN (production) - approccio "embedded" senza build separata -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
/*<![CDATA[*/
function ClassificaApp({ torneoId }) {
    const [rows, setRows] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [errore, setErrore] = React.useState(null);
    const [filtro, setFiltro] = React.useState("");
    const [ordine, setOrdine] = React.useState("punti");

    React.useEffect(() => {
        fetch(`/rest/tornei/${torneoId}/classifica`)
            .then(r => {
                if (!r.ok) throw new Error("Errore caricamento");
                return r.json();
            })
            .then(data => { setRows(data); setLoading(false); })
            .catch(e => { setErrore(e.message); setLoading(false); });
    }, [torneoId]);

    if (loading) return <p style={{color: "var(--color-text-soft)"}}>Caricamento...</p>;
    if (errore)  return <p className="alert danger">Errore: {errore}</p>;
    if (rows.length === 0) return <p className="alert">Nessuna partita giocata: classifica vuota.</p>;

    const filtrate = rows
        .filter(r => r.nomeSquadra.toLowerCase().includes(filtro.toLowerCase()))
        .sort((a, b) => {
            switch (ordine) {
                case "punti":   return b.punti - a.punti;
                case "gf":      return b.golFatti - a.golFatti;
                case "dr":      return b.differenzaReti - a.differenzaReti;
                case "nome":    return a.nomeSquadra.localeCompare(b.nomeSquadra);
                default:        return 0;
            }
        });

    return (
        <div>
            <div style={{display: "flex", gap: 12, marginBottom: 16, flexWrap: "wrap"}}>
                <input
                    type="text"
                    placeholder="Filtra per nome squadra..."
                    value={filtro}
                    onChange={e => setFiltro(e.target.value)}
                    style={{flex: 1, minWidth: 200, padding: "8px 12px",
                            border: "1px solid var(--color-border)",
                            borderRadius: "var(--radius-sm)", fontSize: 14}}
                />
                <select value={ordine} onChange={e => setOrdine(e.target.value)}
                        style={{padding: "8px 12px",
                                border: "1px solid var(--color-border)",
                                borderRadius: "var(--radius-sm)", fontSize: 14}}>
                    <option value="punti">Ordina per punti</option>
                    <option value="gf">Ordina per gol fatti</option>
                    <option value="dr">Ordina per differenza reti</option>
                    <option value="nome">Ordina per nome</option>
                </select>
            </div>
            <table className="table">
                <thead>
                    <tr>
                        <th>#</th><th>Squadra</th><th>PG</th><th>V</th><th>P</th><th>S</th>
                        <th>GF</th><th>GS</th><th>DR</th><th>Pt</th>
                    </tr>
                </thead>
                <tbody>
                    {filtrate.map((r, i) => (
                        <tr key={r.squadraId}>
                            <td><strong>{i + 1}</strong></td>
                            <td>{r.nomeSquadra}</td>
                            <td>{r.partiteGiocate}</td>
                            <td>{r.vittorie}</td>
                            <td>{r.pareggi}</td>
                            <td>{r.sconfitte}</td>
                            <td>{r.golFatti}</td>
                            <td>{r.golSubiti}</td>
                            <td>{r.differenzaReti}</td>
                            <td><strong style={{color: "var(--color-primary)"}}>{r.punti}</strong></td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

const container = document.getElementById("classifica-react");
const torneoId = container.dataset.torneoId;
ReactDOM.createRoot(container).render(<ClassificaApp torneoId={torneoId} />);
/*]]>*/
</script>
</body>
</html>
