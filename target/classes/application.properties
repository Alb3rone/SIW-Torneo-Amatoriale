# ============================================================
# SIW Tornei - configurazione applicazione
# ============================================================

spring.application.name=siw-tornei
server.port=8080

# ------------------------------------------------------------
# DATABASE - PostgreSQL
# ------------------------------------------------------------
# 1) Crea il database in PostgreSQL:  CREATE DATABASE siw_tornei;
# 2) Modifica username/password se diversi dai tuoi.
spring.datasource.url=jdbc:postgresql://localhost:5432/siw_tornei
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Anti-pattern Open Session In View: disattivato per evitare query lazy nel rendering view
spring.jpa.open-in-view=false
# Statistiche utili per l'analisi N+1 (Sezione 8.2 del PDF). Attivare solo quando serve.
# spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=DEBUG
# Per vedere i parametri delle query, decommenta la riga seguente
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false

# ------------------------------------------------------------
# Multipart upload (per eventuali upload futuri)
# ------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cartella dove FileStorageService salva i loghi delle squadre (e altre immagini)
app.upload-dir=uploads
