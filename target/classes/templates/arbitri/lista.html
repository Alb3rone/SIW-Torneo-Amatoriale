<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Arbitri')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container container-wide">
    <div class="header-row">
        <div>
            <h1 class="page-title">Arbitri</h1>
            <p class="page-subtitle">
                <span th:text="${arbitri.size()}">0</span> arbitri abilitati nel sistema
            </p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/arbitri/admin/nuovo}" class="btn">
            + Nuovo arbitro
        </a>
    </div>

    <div class="arbitri-grid" th:if="${!arbitri.isEmpty()}">
        <div th:each="a : ${arbitri}" class="arbitro-card">
            <div class="arbitro-avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(a.cognome, 0, 1))}">A</div>
            <p class="nome" th:text="${a.cognome} + ' ' + ${a.nome}">Mario Rossi</p>
            <span class="codice" th:text="${a.codiceArbitrale}">AB-123</span>
            <div sec:authorize="hasRole('ADMIN')" style="display: flex; justify-content: center; gap: 8px;">
                <form th:action="@{/arbitri/admin/elimina/{id}(id=${a.id})}" method="post">
                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('Eliminare?')">Elimina</button>
                </form>
            </div>
        </div>
    </div>

    <p th:if="${arbitri.isEmpty()}" class="alert">Nessun arbitro registrato.</p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
